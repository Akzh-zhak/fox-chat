
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>FOX CHAT</title>
        <style>
            * { box-sizing: border-box; }
                body {
                      margin: 0;
                            min-height: 100vh;
                                  font-family: Arial, sans-serif;
                                        background: #100e18;
                                              color: #fff;
                                                    display: flex;
                                                          justify-content: center;
                                                                align-items: center;
                                                                      padding: 24px 16px;
                                                                          }
                                                                              .app { width: 100%; max-width: 410px; }
                                                                                  .logo {
                                                                                        text-align: center;
                                                                                              margin-bottom: 28px;
                                                                                                  }
                                                                                                      .fox {
                                                                                                            display: inline-grid;
                                                                                                                  place-items: center;
                                                                                                                        width: 66px;
                                                                                                                              height: 66px;
                                                                                                                                    border-radius: 22px;
                                                                                                                                          background: linear-gradient(135deg, #ff9a5a, #fa477b);
                                                                                                                                                font-size: 34px;
                                                                                                                                                      box-shadow: 0 8px 35px #fa477b40;
                                                                                                                                                          }
                                                                                                                                                              h1 {
                                                                                                                                                                    font-size: 32px;
                                                                                                                                                                          letter-spacing: 3px;
                                                                                                                                                                                margin: 14px 0 8px;
                                                                                                                                                                                    }
                                                                                                                                                                                        .subtitle { color: #aaa5bb; font-size: 14px; }
                                                                                                                                                                                            .card {
                                                                                                                                                                                                  background: #1c1928;
                                                                                                                                                                                                        border: 1px solid #332d43;
                                                                                                                                                                                                              border-radius: 22px;
                                                                                                                                                                                                                    padding: 24px;
                                                                                                                                                                                                                        }
                                                                                                                                                                                                                            .tabs {
                                                                                                                                                                                                                                  display: flex;
                                                                                                                                                                                                                                        gap: 8px;
                                                                                                                                                                                                                                              background: #100e18;
                                                                                                                                                                                                                                                    padding: 5px;
                                                                                                                                                                                                                                                          border-radius: 12px;
                                                                                                                                                                                                                                                                margin-bottom: 24px;
                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                        .tabs button {
                                                                                                                                                                                                                                                                              flex: 1;
                                                                                                                                                                                                                                                                                    border: 0;
                                                                                                                                                                                                                                                                                          border-radius: 9px;
                                                                                                                                                                                                                                                                                                padding: 12px 4px;
                                                                                                                                                                                                                                                                                                      color: #aaa5bb;
                                                                                                                                                                                                                                                                                                            background: transparent;
                                                                                                                                                                                                                                                                                                                  font-size: 14px;
                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                          .tabs button.active {
                                                                                                                                                                                                                                                                                                                                background: #fa6680;
                                                                                                                                                                                                                                                                                                                                      color: #fff;
                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                              h2 { font-size: 23px; margin: 0 0 8px; }
                                                                                                                                                                                                                                                                                                                                                  .hint { color: #aaa5bb; font-size: 14px; margin-bottom: 22px; }
                                                                                                                                                                                                                                                                                                                                                      label {
                                                                                                                                                                                                                                                                                                                                                            display: block;
                                                                                                                                                                                                                                                                                                                                                                  color: #d6d1e1;
                                                                                                                                                                                                                                                                                                                                                                        font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                                              margin: 16px 0 8px;
                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                      input {
                                                                                                                                                                                                                                                                                                                                                                                            width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                  padding: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                        border: 1px solid #393349;
                                                                                                                                                                                                                                                                                                                                                                                                              border-radius: 11px;
                                                                                                                                                                                                                                                                                                                                                                                                                    background: #12101b;
                                                                                                                                                                                                                                                                                                                                                                                                                          color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                      outline: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                              input:focus { border-color: #fa6680; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                  .main-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              margin-top: 22px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    padding: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          border: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 11px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      background: linear-gradient(100deg, #ff925d, #f34c89);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                #message {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #ffb1c2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  line-height: 1.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .bottom {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            color: #777185;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 22px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <main class="app">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <header class="logo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="fox">🦊</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h1>FOX CHAT</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="subtitle">Твоё общение. Твои правила.</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <section class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="tabs">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="loginTab" class="active" onclick="setMode('login')">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Войти
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button id="registerTab" onclick="setMode('register')">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Регистрация
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2 id="heading">С возвращением!</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="hint" id="hint">Рады снова тебя видеть 🖤</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <form id="authForm">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="nameField" hidden>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label for="username">Твой ник</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input id="username" placeholder="Например, foxgirl">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label for="email">Электронная почта</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input id="email" type="email" placeholder="you@example.com" required>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label for="password">Пароль</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input id="password" type="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              placeholder="Минимум 6 символов" minlength="6" required>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="main-btn" id="submitBtn" type="submit">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Войти в чат
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="message">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Это начальная страница. Регистрация пока не подключена.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <footer class="bottom">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                FOX CHAT · Общайся свободно
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let mode = "login";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function setMode(nextMode) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      mode = nextMode;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const registering = mode === "register";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("nameField").hidden = !registering;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("loginTab").classList.toggle("active", !registering);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("registerTab").classList.toggle("active", registering);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("heading").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            registering ? "Создай аккаунт" : "С возвращением!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("hint").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          registering ? "Присоединяйся к FOX CHAT ✨" : "Рады снова тебя видеть 🖤";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("submitBtn").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        registering ? "Создать аккаунт" : "Войти в чат";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Это начальная страница. Регистрация пока не подключена.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("authForm").addEventListener("submit", function(event) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    event.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("message").textContent =
